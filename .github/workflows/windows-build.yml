name: Windows Nuitka build

on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A tag build already attaches files to a draft. Publishing that draft need
    # not compile it again. Releases created without binaries are built here.
    if: github.event_name != 'release' || !contains(github.event.release.assets.*.name, 'DKR Workshop.exe')
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: .github/requirements-build.txt
      - name: Validate release version
        id: version
        run: python .github/scripts/build_windows.py --prepare-only
      - name: Install pinned build dependencies
        run: python -m pip install -r .github/requirements-build.txt
      - name: Check imports and ROM-free tests
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_camera.py tests/test_release_build.py --junitxml=artifacts/windows-build-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m src.main --help
      - name: Compile onefile Windows EXE
        run: python .github/scripts/build_windows.py
      - name: Verify isolated EXE and write checksum
        run: python .github/scripts/verify_windows.py
      - name: Upload Windows download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DKR-Workshop-${{ steps.version.outputs.version }}-windows-x64
          path: artifacts/windows-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/windows-build/compilation-report.xml
            artifacts/windows-build/packaged-help.log
            artifacts/windows-build-tests.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DKR-Workshop-${{ needs.build.outputs.version }}-windows-x64
          path: release
      - name: Attach to release (create a draft for a new tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          zip -r "DKR-Workshop-${RELEASE_VERSION}-windows-x64.zip" "DKR Workshop.exe" README.txt THIRD_PARTY_NOTICES.txt licenses SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DKR Workshop ${RELEASE_VERSION}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "DKR Workshop.exe" "DKR-Workshop-${RELEASE_VERSION}-windows-x64.zip" SHA256SUMS.txt --clobber
